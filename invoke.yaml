releaser:
  module_name: minchin.releaser
  here: .
  docs: none
  test: minchin/releaser/tests
  source: minchin
  changelog: CHANGELOG.rst
  version: minchin/releaser/constants.py
  test_command: "green -kq minchin.releaser.tests.test_setup"
  version_bump: none
  extra_packages:
    test:
      - bleach
      - build
      - colorama
      - gitpython
      - invoke
      - isort
      - pkginfo
      - readme_renderer
      - semantic_version
      - setuptools
      - twine
      - wheel
      - zipp
    pypi:
      # - idna==3.10
  vendor_dest: minchin/releaser/_vendor
  vendor_packages:
    "minchin.text":
      src: ../minchin.text/minchin
      dest: .
      requirements: ../minchin.text/requirements.in
  vendor_override_src: vendor_src
